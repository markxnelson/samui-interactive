<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samui Interactiff</title>
  <meta name="description" content="Samui Interactiff — retrouvez nos vidéos sur YouTube. Watch our videos on YouTube.">
  <meta property="og:title" content="Samui Interactiff">
  <meta property="og:description" content="Retrouvez nos vidéos sur YouTube. Watch our videos on YouTube.">
  <meta property="og:image" content="https://samui-interactive.com/samui-interactiff-logo.png">
  <meta name="theme-color" content="#2b282a">
  <link rel="icon" href="samui-interactiff-logo.png">
  <style>
    :root {
      --bg: #2b282a;
      --fg: #efe9dc;
      --muted: #a39d93;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      background: radial-gradient(ellipse at center, #363234 0%, var(--bg) 70%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .logo {
      width: min(560px, 90vw);
      height: auto;
      /* Fade the photo's edges into the page background */
      -webkit-mask-image: radial-gradient(ellipse 50% 50% at center, #000 55%, transparent 100%);
              mask-image: radial-gradient(ellipse 50% 50% at center, #000 55%, transparent 100%);
    }
    .video {
      width: min(720px, 100%);
      aspect-ratio: 16 / 9;
      margin: 2.5rem auto 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .channel {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.7rem 1.3rem;
      border: 1px solid var(--fg);
      border-radius: 999px;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.2s, color 0.2s;
    }
    .channel:hover, .channel:focus-visible {
      background: var(--fg);
      color: var(--bg);
    }
    .channel svg { width: 1.2em; height: 1.2em; fill: currentColor; }
    .channel .sep { opacity: 0.5; }
    main { width: 100%; }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="samui-interactiff-logo.png" alt="samui interactiff" width="948" height="503">
    <div class="video">
      <iframe src="https://www.youtube-nocookie.com/embed/WRBHz2lpUYQ" title="Samui Interactive — YouTube" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
    </div>
    <a class="channel" href="https://www.youtube.com/@SamuiInteractive" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
      <span>Notre chaîne YouTube</span><span class="sep" aria-hidden="true">·</span><span lang="en">Our YouTube channel</span>
    </a>
  </main>
  <footer>&copy; <span id="year">2026</span> Samui Interactiff</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
